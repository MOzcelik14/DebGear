name: Build DebGear AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on Debian Trixie
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          apt-get update

          apt-get install -y \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            build-essential \
            patchelf \
            wget \
            curl \
            file \
            desktop-file-utils \
            libgtk-4-1 \
            libadwaita-1-0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gobject-introspection


      # --------------------------------------------------
      # PYTHON ENVIRONMENT
      # --------------------------------------------------

      - name: Create Python environment
        run: |
          python3 -m venv \
            --system-site-packages \
            .venv

          . .venv/bin/activate

          python -m pip install --upgrade pip

          pip install pyinstaller


      # --------------------------------------------------
      # PYINSTALLER
      # --------------------------------------------------

      - name: Build DebGear executable
        run: |
          . .venv/bin/activate

          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name DebGear \
            debgear.py


      # --------------------------------------------------
      # APPDIR
      # --------------------------------------------------

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp \
            dist/DebGear \
            AppDir/usr/bin/DebGear


      # --------------------------------------------------
      # DESKTOP FILE
      # --------------------------------------------------

      - name: Create desktop entry
        run: |
          cat > AppDir/usr/share/applications/com.mozcelik.DebGear.desktop <<'EOF'
          [Desktop Entry]
          Name=DebGear
          Comment=Hardware and driver management for Debian
          Exec=DebGear
          Icon=com.mozcelik.DebGear
          Type=Application
          Categories=System;Settings;
          Terminal=false
          StartupNotify=true
          EOF


      # --------------------------------------------------
      # APPIMAGE TOOL
      # --------------------------------------------------

      - name: Download appimagetool
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool


      # --------------------------------------------------
      # BUILD APPIMAGE
      # --------------------------------------------------

      - name: Build AppImage
        run: |
          ARCH=x86_64 \
            ./appimagetool \
            AppDir \
            DebGear-x86_64.AppImage


      # --------------------------------------------------
      # VERIFY
      # --------------------------------------------------

      - name: Verify AppImage
        run: |
          file DebGear-x86_64.AppImage
          ls -lh DebGear-x86_64.AppImage


      # --------------------------------------------------
      # GITHUB RELEASE
      # --------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DebGear-x86_64.AppImage
          generate_release_notes: true
